<script>
'use strict';
'use strict';
var ALLPOIS=POIS.concat(POIS_SZ);
var CATICON={spot:'🏛️',food:'🍜',photo:'📸',avoid:'⚠️',hotel:'🛏️',transit:'🚄'};
var state={city:'nj',day:3};
var layer,markerRef={},currentPts=[];

var map=L.map('map',{zoomControl:true,attributionControl:true}).setView([32.06,118.78],12);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{
  subdomains:['1','2','3','4'],maxZoom:18,maxNativeZoom:18,detectRetina:true,attribution:'© 高德地图'
}).addTo(map);
L.control.scale({imperial:false}).addTo(map);
layer=L.layerGroup().addTo(map);

function findPOI(city,nm){for(var i=0;i<ALLPOIS.length;i++){var p=ALLPOIS[i];if(p.city===city&&p.name===nm)return p;}return null;}

function popupHtml(p,isStop,num){
  var h='';
  h+='<div class="pop-t"><span class="tag" style="background:'+CATS[p.cat].color+'">'+CATICON[p.cat]+' '+CATS[p.cat].label+'</span>'+p.name+'</div>';
  var chips=[];
  if(isStop&&num)chips.push('🚩 动线第 '+num+' 站');
  if(p.tm)chips.push('⏰ '+p.tm);
  if(p.dur)chips.push('时长 '+p.dur);
  if(p.cost)chips.push('💰 '+p.cost);
  if(chips.length)h+='<div class="chips">'+chips.map(function(x){return '<span class="chip">'+x+'</span>';}).join('')+'</div>';
  if(p.plan&&p.plan.length){h+='<div style="font-weight:700;margin-top:4px">📍 怎么玩</div>';p.plan.forEach(function(s){h+='<div class="step">'+s+'</div>';});}
  if(p.rows&&p.rows.length){h+='<table class="po">';p.rows.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';});h+='</table>';}
  if(p.note)h+='<div class="note">💡 '+p.note+'</div>';
  if(p.warn)h+='<div class="warn">⚠️ '+p.warn+'</div>';
  return h;
}

function dayList(c,d){
  var route=(d!==null)?ROUTES[c+'-'+d]:null,idx={};
  if(route)route.forEach(function(nm,i){var p=findPOI(c,nm);if(p)idx[p.id]=i+1;});
  var list=ALLPOIS.filter(function(p){
    if(p.city!==c)return false;
    if(d===null)return p.cat==='spot'||p.cat==='photo'||p.cat==='food';
    return p.day&&p.day.indexOf(d)>=0;
  });
  list.sort(function(a,b){var na=idx[a.id]||999,nb=idx[b.id]||999;if(na!==nb)return na-nb;return 0;});
  return {list:list,idx:idx,route:route};
}

function render(){
  layer.clearLayers();markerRef={};
  var c=state.city,d=state.day;
  renderTabs();
  var dl=dayList(c,d),list=dl.list,idx=dl.idx,route=dl.route;
  currentPts=[];
  list.forEach(function(p){
    var isStop=d!==null&&idx[p.id]!==undefined;
    var num=idx[p.id];
    var bg=(isStop&&d!==null)?DAYMETA[c][d].color:CATS[p.cat].color;
    var size=isStop?32:24;
    var inner=isStop?String(num):CATICON[p.cat];
    var html='<div class="pin'+(isStop?' stop':' ctx')+'" style="background:'+bg+'">'+inner+'</div>';
    var icon=L.divIcon({className:'',html:html,iconSize:[size,size],iconAnchor:[size/2,size/2]});
    var m=L.marker([p.lat,p.lng],{icon:icon,title:p.name}).addTo(layer);
    m.bindPopup(popupHtml(p,isStop,num),{maxWidth:300,closeButton:true});
    markerRef[p.id]=m;
    currentPts.push([p.lat,p.lng]);
  });
  if(route){
    var pts=[];
    route.forEach(function(nm){var p=findPOI(c,nm);if(p)pts.push([p.lat,p.lng]);});
    if(pts.length>1){
      L.polyline(pts,{color:DAYMETA[c][d].color,weight:4,opacity:.8,dashArray:'7 8',lineCap:'round'}).addTo(layer);
    }
  }
  fitTo(currentPts);
  showDayCard();showTimeline();showPoiList();renderLegend();
}

function fitTo(lls){
  if(!lls.length)return;
  var b=L.latLngBounds(lls);
  map.fitBounds(b,{padding:[24,24],maxZoom:16});
  var z=map.getZoom()+2;
  if(z>18)z=18;
  map.setZoom(z,{animate:false});
}

function setDay(n){
  state.day=n;render();
}
function setCity(c){
  if(state.city===c)return;
  state.city=c;state.day=(c==='nj'?3:1);
  document.getElementById('city-nj').classList.toggle('on',c==='nj');
  document.getElementById('city-sz').classList.toggle('on',c==='sz');
  render();
}

function renderTabs(){
  var el=document.getElementById('dayTabs'),c=state.city;
  var days=(c==='nj'?NJDAYS:SZDAYS);
  var h='<button class="day-tab'+(state.day===null?' on':'')+'" data-d="0">🗺️ 总览</button>';
  days.forEach(function(n){
    var m=DAYMETA[c][n];
    h+='<button class="day-tab'+(state.day===n?' on':'')+'" data-d="'+n+'"><i class="dd" style="background:'+m.color+'"></i>'+m.label+'</button>';
  });
  el.innerHTML=h;
  el.querySelectorAll('.day-tab').forEach(function(btn){
    btn.onclick=function(){setDay(btn.getAttribute('data-d')==='0'?null:+btn.getAttribute('data-d'));};
  });
}

function showDayCard(){
  var el=document.getElementById('dayCard'),c=state.city,d=state.day;
  var key=c+'-'+(d===null?0:d);
  el.innerHTML=DAYCARDS[key]||'<div style="font-size:12.5px;color:var(--sub)">选一个日期查看当天行程</div>';
}

function showTimeline(){
  var el=document.getElementById('timelineCard'),c=state.city,d=state.day;
  if(d===null){el.innerHTML='<h3>⏰ 当日时间轴</h3><div style="font-size:12px;color:var(--sub)">先选一个日期，这里会按时间段列出当天安排</div>';return;}
  var sch=SCHED[c+'-'+d]||[];
  var h='<h3>⏰ 当日时间轴</h3><ul class="tl">';
  sch.forEach(function(it){
    h+='<li><span class="t">'+it.t+'</span><span>';
    h+=it.act;
    if(it.loc&&findPOI(c,it.loc))h+=' <span class="lk" data-loc="'+it.loc+'">📍 '+it.loc+'</span>';
    if(it.tag)h+='<span class="tg">'+it.tag+'</span>';
    if(it.cost)h+=' <span class="cst">'+it.cost+'</span>';
    h+='</span></li>';
  });
  h+='</ul>';
  el.innerHTML=h;
  el.querySelectorAll('.lk').forEach(function(elm){
    elm.onclick=function(){
      var p=findPOI(c,elm.getAttribute('data-loc'));
      if(p&&markerRef[p.id]){map.flyTo(markerRef[p.id].getLatLng(),15,{duration:.6});markerRef[p.id].openPopup();}
    };
  });
}

function showPoiList(){
  var el=document.getElementById('poiList'),c=state.city,d=state.day;
  var dl=dayList(c,d),list=dl.list,idx=dl.idx;
  var h='<h3>📍 当日点位</h3>';
  list.forEach(function(p){
    var n=idx[p.id];
    var bg=(n&&d!==null)?DAYMETA[c][d].color:CATS[p.cat].color;
    h+='<div class="poi" data-id="'+p.id+'"><span class="n" style="background:'+bg+'">'+(n||CATICON[p.cat])+'</span><span class="nm">'+p.name+'</span>'+(p.tm?'<span class="tm">'+p.tm+'</span>':'')+'</div>';
  });
  el.innerHTML=h;
  el.querySelectorAll('.poi').forEach(function(elm){
    elm.onclick=function(){
      var p=findPOI(c,elm.getAttribute('data-id'));
      if(p&&markerRef[p.id]){map.flyTo(markerRef[p.id].getLatLng(),15,{duration:.6});markerRef[p.id].openPopup();}
    };
  });
}

function renderLegend(){
  var el=document.getElementById('legendBox');
  var names={spot:'景点',food:'美食',photo:'拍照机位',hotel:'住宿',transit:'交通',avoid:'避雷'},keys=['spot','food','photo','hotel','transit','avoid'],h='<h3>🗺️ 图例</h3>';
  keys.forEach(function(k){h+='<span class="it"><span class="d" style="background:'+CATS[k].color+'"></span>'+names[k]+'</span>';});
  h+='<span class="it"><span class="d" style="background:#444"></span>动线主站(编号)</span>';
  h+='<span class="it"><span class="ln" style="background:#555"></span>当日动线</span>';
  el.innerHTML=h;
}

document.getElementById('city-nj').onclick=function(){setCity('nj');};
document.getElementById('city-sz').onclick=function(){setCity('sz');};
(function(){
  var btn=document.getElementById('sheetBtn'),panel=document.getElementById('sidePanel'),hd=document.getElementById('sheetHandle');
  if(!btn||!panel)return;
  function setSheet(open){panel.classList.toggle('open',open);btn.textContent=open?'✕ 收起行程':'📋 行程表';}
  btn.onclick=function(){setSheet(!panel.classList.contains('open'));};
  if(hd)hd.onclick=function(){setSheet(false);};
})();
document.getElementById('fitBtn').onclick=function(){fitTo(currentPts);};
render();

</script>

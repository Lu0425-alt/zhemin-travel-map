<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(135deg,#13203a 0%,#1f3a5f 55%,#2b4f7a 100%);color:#fff;padding:10px 16px 0;box-shadow:0 2px 10px rgba(20,30,50,.25);position:relative;z-index:600}
.hd-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
h1 small{font-size:11px;font-weight:400;opacity:.8;margin-left:6px}
.city-switch{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;margin-left:auto}
.city-switch button{border:none;background:transparent;color:#c9d6e8;padding:4px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s}
.city-switch button.on{background:#fff;color:var(--navy);font-weight:700}
.hd-meta{font-size:11.5px;color:#b9c8dd;margin:6px 0 8px;display:flex;gap:12px;flex-wrap:wrap}
.hd-meta span{display:inline-flex;align-items:center;gap:3px}
#dayTabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.day-tab{border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#e6edf7;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.day-tab .dd{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.day-tab:hover{background:rgba(255,255,255,.2)}
.day-tab.on{background:#fff;color:var(--navy);font-weight:700;border-color:#fff}
.day-tab.on .dd{outline:2px solid rgba(30,58,95,.25);outline-offset:1px}
.day-tab.overview{font-weight:600}
#layout{flex:1;display:flex;min-height:0}
#side{width:340px;background:transparent;overflow-y:auto;padding:14px 10px 14px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:0 3px 10px rgba(160,120,70,.12)}

#daySub{font-size:11.5px;color:var(--sub);margin-top:2px}
.route-list{margin-top:10px;display:flex;flex-direction:column;gap:0}
.route-item{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:12.5px}
.route-item .n{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.route-item .ic{flex-shrink:0}
.route-item .t{flex:1;min-width:0}
.route-item .t b{font-weight:700;color:var(--ink)}
.route-item .t span{display:block;font-size:11px;color:var(--sub)}
.book-box{background:#FFF8E7;border:1.5px solid #E3C87A;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.75}
.book-box b{color:#92600A;font-size:12.5px}
.book-box ul{padding-left:16px;color:#7A5B12}
#card{display:none}
#card .cd{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--navy)}
#card .cd i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
#card ul{padding-left:18px;color:#4a4f5a;font-size:12.5px;line-height:1.85}
#card li{margin:2px 0}
#card .cost{margin-top:8px;color:var(--amber);font-weight:700;font-size:12.5px;background:#FEF3E2;border-radius:8px;padding:6px 9px}
.legend{font-size:11.5px;color:var(--sub);line-height:1.8;display:flex;flex-wrap:wrap;gap:4px 12px}
.legend .it{display:inline-flex;align-items:center;gap:5px}
.legend .d{width:10px;height:10px;border-radius:50%;display:inline-block}
#map{flex:1;min-width:0;position:relative;margin:12px 14px 14px 0;background:var(--mapbg);border:2px solid var(--border);border-radius:20px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#svgMap{position:absolute;inset:0;width:100%;height:100%}
.world{transition:transform .25s ease}
.world.nosmooth{transition:none}
.water{stroke-linejoin:round}
.geo{font-size:15px;font-weight:800;fill:#7c9fbf;letter-spacing:2px;pointer-events:none}
.geo.water-t{fill:#5c86a8}
.geo.hill-t{fill:#7a9c66}
.mk{cursor:pointer}
.mk .dot{transition:transform .15s,filter .15s}
.mk:hover .dot{transform:scale(1.22);filter:brightness(1.05)}
.mk.hl .dot{transform:scale(1.35)}
.mk .lbl{font-size:12.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:rgba(255,243,220,.98);stroke-width:6px;stroke-linejoin:round;pointer-events:none;opacity:1}
.mk.overview .lbl{opacity:0;transition:opacity .12s}
.mk.ctx .lbl{opacity:0;transition:opacity .12s}
.mk.ctx:hover .lbl{opacity:1}
.mk.ctx .dot{opacity:.85}
.mk.overview:hover .lbl{opacity:1}
.mk .ic{font-size:14px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk .num{pointer-events:none}
.mk .numt{font-size:10.5px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--ink);pointer-events:none}
.mk.overview .dot{opacity:.55}
.rt-line{fill:none;stroke-width:4;stroke-dasharray:2 11;stroke-linecap:round;opacity:.9}
.rt-start{font-size:11px;font-weight:800;fill:#2E9E5B;paint-order:stroke;stroke:rgba(255,255,255,.95);stroke-width:4px;pointer-events:none}
.rt-arrow{fill:#fff;stroke-width:1.5}
#popup{position:absolute;right:12px;bottom:12px;width:min(330px,calc(100% - 24px));background:#fff;border:1.5px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(60,40,10,.28);padding:12px 14px;font-size:12.5px;line-height:1.7;color:#4a4f5a;display:none;z-index:30;max-height:58%;overflow-y:auto}
#popup.show{display:block;animation:up .18s ease}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#popup .pop-t{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:6px;padding-right:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#popup .tag{color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
#popup .row{display:flex;gap:8px;margin:4px 0}
#popup .row b{color:var(--ink);flex-shrink:0;min-width:52px;font-weight:700}
#popup .note{margin-top:8px;padding:7px 9px;background:#FFF8E7;border:1px solid #F0DCA8;border-radius:9px;color:#8A5A10}
#popup .warn{margin-top:6px;padding:7px 9px;background:#FEF2F2;border:1px solid #F5C2C2;border-radius:9px;color:#9B1C1C}
#popup .x{position:absolute;top:8px;right:10px;border:none;background:#F3E9D8;color:#8a7a5c;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1}
#popup .x:hover{background:#E8D9BD;color:var(--ink)}
#zoomBox{position:absolute;right:12px;top:12px;z-index:20;display:flex;flex-direction:column;gap:6px}
#zoomBox button{width:30px;height:30px;border:1.5px solid var(--border);background:#fff;border-radius:9px;font-size:15px;font-weight:800;color:var(--navy);cursor:pointer;box-shadow:0 2px 6px rgba(160,120,70,.18);line-height:1}
#zoomBox button:hover{background:#FBF1DC}
#fitBtn{position:absolute;left:12px;bottom:12px;z-index:20;border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:11.5px;color:var(--navy);cursor:pointer;box-shadow:0 2px 6px rgba(160,120,70,.18)}

#mapHint{position:absolute;left:12px;top:12px;z-index:20;background:rgba(255,255,255,.92);border:1.5px solid var(--border);border-radius:999px;padding:4px 11px;font-size:11px;color:var(--sub);box-shadow:0 2px 6px rgba(160,120,70,.15);pointer-events:none}
@media (max-width:860px){
  #layout{flex-direction:column}
  #side{width:100%;order:2;padding:12px}
  #map{order:1;height:56vh;margin:12px}
  h1{font-size:15px}
  .hd-meta{gap:6px}
}
</style>
</head>

/* ---- 元素引用 ---- */
var svgEl=document.getElementById('svgMap'), worldG=document.getElementById('world');
var mapEl=document.getElementById('map'), popEl=document.getElementById('popup');
var view={s:1,tx:0,ty:0},ADJ={};

function computeAdj(){
  ADJ={};
  var c=state.city,d=state.day;
  var list=ALLPOIS.filter(function(p){return p.city===c&&d!==null&&p.day&&p.day.indexOf(d)>=0;});
  if(list.length<2){list.forEach(function(p){var q=proj(c,p.lat,p.lng);ADJ[p.id]={x:q.x,y:q.y};});return;}
  var pts=list.map(function(p){var q=proj(c,p.lat,p.lng);return {id:p.id,x:q.x,y:q.y,dx:0,dy:0};});
  var minDist=38;
  for(var it=0;it<5;it++){
    for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){
      var a=pts[i],b=pts[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<minDist&&dist>0.5){
        var push=(minDist-dist)*0.35,ux=dx/dist,uy=dy/dist;
        a.dx-=ux*push;a.dy-=uy*push;b.dx+=ux*push;b.dy+=uy*push;
      }
    }
  }
  pts.forEach(function(q){
    var m=Math.hypot(q.dx,q.dy);
    if(m>30){q.dx*=30/m;q.dy*=30/m;}
    ADJ[q.id]={x:q.x+q.dx,y:q.y+q.dy};
  });
  // 动线展开：沿线拉开相邻站点，保证编号清晰可读
  var route=d!==null?ROUTES[c+'-'+d]:null;
  if(route){
    var ids=[];
    route.forEach(function(nm){var p=findPOI(c,nm);if(p&&ADJ[p.id])ids.push(p.id);});
    for(var pass=0;pass<5;pass++){
      var moved=false;
      for(var k=0;k<ids.length-1;k++){
        var a=ADJ[ids[k]],b=ADJ[ids[k+1]];
        if(!a||!b)continue;
        var dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy);
        if(dd<48&&dd>0.5){
          var ux=dx/dd,uy=dy/dd,push=48-dd;
          b.x+=ux*push;b.y+=uy*push;moved=true;
        }
      }
      if(!moved)break;
    }
  }
  // 二次微调：拉开仍过近的任意两点
  var keys=Object.keys(ADJ);
  for(var it=0;it<3;it++){
    for(var i2=0;i2<keys.length;i2++)for(var j2=i2+1;j2<keys.length;j2++){
      var a2=ADJ[keys[i2]],b2=ADJ[keys[j2]];
      var dx2=b2.x-a2.x,dy2=b2.y-a2.y,d2=Math.hypot(dx2,dy2);
      if(d2<42&&d2>0.5){
        var push2=(42-d2)*0.4,ux2=dx2/d2,uy2=dy2/d2;
        a2.x-=ux2*push2;a2.y-=uy2*push2;b2.x+=ux2*push2;b2.y+=uy2*push2;
      }
    }
  }
  list.forEach(function(p){
    var q=proj(c,p.lat,p.lng),A=ADJ[p.id];
    var dx3=A.x-q.x,dy3=A.y-q.y,m3=Math.hypot(dx3,dy3);
    if(m3>45){A.x=q.x+dx3*45/m3;A.y=q.y+dy3*45/m3;}
  });
}

/* ---- 图层 ---- */
function drawMarkers(){
  var old=svgEl.querySelector('.layer-mk'); if(old)old.remove();
  var c=state.city,d=state.day,layer=document.createElementNS(NS,'g');
  layer.setAttribute('class','layer-mk');
  var route=(d!==null)?ROUTES[c+'-'+d]:null, idx={};
  if(route)route.forEach(function(nm,i){var p=findPOI(c,nm);if(p)idx[p.id]=i+1;});
  var list=ALLPOIS.filter(function(p){
    if(p.city!==c)return false;
    if(d===null)return p.cat==='spot'||p.cat==='photo'||p.cat==='food';
    return p.day&&p.day.indexOf(d)>=0;
  });
  var centers=[];
  list.forEach(function(p){
    var pt=ADJ[p.id]||proj(c,p.lat,p.lng);
    if(d!==null&&idx[p.id]===undefined&&p.cat!=='hotel'&&p.cat!=='transit')return;
    centers.push({p:p,x:pt.x,y:pt.y});
  });
  var placed=[];
  centers.forEach(function(it){
    var p=it.p,pt={x:it.x,y:it.y},g=document.createElementNS(NS,'g');
    g.setAttribute('class','mk cat-'+p.cat+(d===null?' overview':' day'));
    g.setAttribute('transform','translate('+pt.x.toFixed(1)+','+pt.y.toFixed(1)+')');
    var num=idx[p.id],inner;
    if(d===null){
      inner='<circle class="dot" r="6.5" fill="'+CATS[p.cat].color+'" stroke="#fff" stroke-width="1.5"/>';
    }else if(num){
      inner='<circle class="dot" r="12" fill="'+CATS[p.cat].color+'" stroke="#fff" stroke-width="3"/>';
      inner+='<circle class="num" r="8" fill="#fff" opacity="0.96"/><text class="numt" y="1">'+num+'</text>';
      g.setAttribute('class','mk cat-'+p.cat+' day stop');
    }else{
      inner='<circle class="dot" r="8.5" fill="'+CATS[p.cat].color+'" stroke="#fff" stroke-width="2" opacity="0.9"/>';
      g.setAttribute('class','mk cat-'+p.cat+' day ctx');
    }
    if(d!==null){
      var nw=p.name.length*13.5+8,nh=18;
      var anchors=[{dx:20,dy:5,an:'start'},{dx:-20,dy:5,an:'end'},{dx:0,dy:-22,an:'middle'},{dx:0,dy:26,an:'middle'}];
      var pick=anchors[0];
      for(var ai=0;ai<anchors.length;ai++){
        var a=anchors[ai],lx=pt.x+a.dx,ly=pt.y+a.dy;
        var box={x:(a.an==='end'?lx-nw:a.an==='middle'?lx-nw/2:lx),y:ly-nh/2,w:nw,h:nh};
        var ok=true;
        for(var bi=0;bi<placed.length;bi++){var q=placed[bi];if(box.x<q.x+q.w&&box.x+box.w>q.x&&box.y<q.y+q.h&&box.y+box.h>q.y){ok=false;break;}}
        if(ok){
          for(var ci=0;ci<centers.length;ci++){
            var o=centers[ci];
            if(o.p.id===p.id)continue;
            if(o.x>box.x-9&&o.x<box.x+box.w+9&&o.y>box.y-9&&o.y<box.y+box.h+9){ok=false;break;}
          }
        }
        if(ok){pick=a;placed.push(box);break;}
      }
      inner+='<text class="lbl" x="'+pick.dx+'" y="'+pick.dy+'" text-anchor="'+pick.an+'">'+p.name+'</text>';
    }else{
      inner+='<title>'+p.name+'</title>';
    }
    g.innerHTML=inner;
    g.addEventListener('click',function(ev){ev.stopPropagation();openPopup(p);});
    layer.appendChild(g);
  });
  svgEl.appendChild(layer);
}
function drawRoute(){
  var old=svgEl.querySelector('.layer-rt'); if(old)old.remove();
  var c=state.city,d=state.day; if(d===null)return;
  var r=ROUTES[c+'-'+d]; if(!r)return;
  var layer=document.createElementNS(NS,'g'); layer.setAttribute('class','layer-rt');
  var pts=[];
  r.forEach(function(nm){var p=findPOI(c,nm);if(p)pts.push(ADJ[p.id]||proj(c,p.lat,p.lng));});
  if(pts.length<2)return;
  var col=DAYMETA[c][d].color,ds='M'+pts[0].x.toFixed(1)+','+pts[0].y.toFixed(1);
  for(var i=1;i<pts.length;i++)ds+=' L'+pts[i].x.toFixed(1)+','+pts[i].y.toFixed(1);
  var casing=document.createElementNS(NS,'path');
  casing.setAttribute('d',ds);casing.setAttribute('stroke','#fff');casing.setAttribute('stroke-width','9');
  casing.setAttribute('fill','none');casing.setAttribute('stroke-linecap','round');casing.setAttribute('opacity','.85');
  layer.appendChild(casing);
  var path=document.createElementNS(NS,'path');
  path.setAttribute('d',ds);path.setAttribute('class','rt-line');path.setAttribute('stroke',col);
  layer.appendChild(path);
  var s0=document.createElementNS(NS,'circle');
  s0.setAttribute('cx',pts[0].x);s0.setAttribute('cy',pts[0].y);s0.setAttribute('r','11');
  s0.setAttribute('fill','#2E9E5B');s0.setAttribute('stroke','#fff');s0.setAttribute('stroke-width','3');
  layer.appendChild(s0);
  var s0t=document.createElementNS(NS,'text');
  s0t.setAttribute('x',pts[0].x+17);s0t.setAttribute('y',pts[0].y+4);
  s0t.setAttribute('class','rt-start');s0t.textContent='起点';
  layer.appendChild(s0t);
  var e=pts[pts.length-1];
  var fl=document.createElementNS(NS,'text');
  fl.setAttribute('x',e.x);fl.setAttribute('y',e.y-16);fl.setAttribute('text-anchor','middle');
  fl.setAttribute('font-size','17');fl.textContent='🚩';
  layer.appendChild(fl);
  svgEl.appendChild(layer);
}

/* ---- 视野 ---- */
function applyView(noSmooth){worldG.classList.toggle('nosmooth',!!noSmooth);worldG.setAttribute('transform','translate('+view.tx.toFixed(1)+','+view.ty.toFixed(1)+') scale('+view.s+')');}
function fitView(){
  var c=state.city,d=state.day,pts=[];
  if(d!==null){var r=ROUTES[c+'-'+d];if(r)r.forEach(function(nm){var p=findPOI(c,nm);if(p)pts.push(ADJ[p.id]||proj(c,p.lat,p.lng));});}
  if(pts.length<2){view={s:1,tx:0,ty:0};applyView();return;}
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pts.forEach(function(p){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
  var cw=Math.max(260,mapEl.clientWidth),ch=Math.max(260,mapEl.clientHeight);
  var kx=cw/VB_W,ky=ch/VB_H[c];
  var s=Math.min(cw*0.86/Math.max((x1-x0)*kx,1),ch*0.86/Math.max((y1-y0)*ky,1));
  s=Math.max(0.6,Math.min(4.5,s));
  view={s:s,tx:VB_W/2-s*(x0+x1)/2,ty:VB_H[c]/2-s*(y0+y1)/2};
  applyView();
}
function toViewBox(ev){
  var ctm=svgEl.getScreenCTM(),pt=svgEl.createSVGPoint();
  pt.x=ev.clientX;pt.y=ev.clientY;
  var q=pt.matrixTransform(ctm.inverse());
  return {x:q.x,y:q.y};
}

/* ---- 侧栏 ---- */
function renderTabs(){
  var box=document.getElementById('dayTabs'),days=(state.city==='nj'?NJDAYS:SZDAYS),h='';
  h+='<button class="day-tab overview'+(state.day===null?' on':'')+'" data-day="all">📋 总览</button>';
  days.forEach(function(n){
    var m=DAYMETA[state.city][n],short=m.label.split(' ')[1]||('D'+n);
    h+='<button class="day-tab'+(state.day===n?' on':'')+'" data-day="'+n+'"><i class="dd" style="background:'+m.color+'"></i>D'+n+' '+short+'</button>';
  });
  box.innerHTML=h;
  Array.prototype.forEach.call(box.querySelectorAll('.day-tab'),function(b){
    b.onclick=function(){var v=b.getAttribute('data-day');setDay(v==='all'?null:+v);};
  });
}
function showCard(){
  var key=state.city+'-'+(state.day===null?0:state.day),html=DAYCARDS[key],card=document.getElementById('card');
  if(html){card.style.display='block';card.innerHTML=html;}else{card.style.display='none';}
}
function updateSidebar(){
  var c=state.city,d=state.day;
  var title=document.getElementById('dayTitle'),sub=document.getElementById('daySub'),rl=document.getElementById('routeList');
  if(d===null){
    title.innerHTML='📋 '+(c==='nj'?'南京':'苏州')+' 总览';
    sub.textContent='点击上方日期，看每天的具体安排';
    rl.innerHTML='';
    return;
  }
  var m=DAYMETA[c][d];
  title.innerHTML='<i class="dd" style="background:'+m.color+'"></i>'+m.label.replace(' ',' · ');
  sub.textContent='当天动线 '+ROUTES[c+'-'+d].length+' 站 · 点地图圆点看详情';
  var h='';
  ROUTES[c+'-'+d].forEach(function(nm,i){
    var p=findPOI(c,nm);
    var ic=p?CATICON[p.cat]:'📍';
    var tip=p&&p.rows?p.rows[0][1].slice(0,26):'';
    if(tip&&tip.length>=26)tip+='…';
    h+='<div class="route-item"><span class="n" style="background:'+m.color+'">'+(i+1)+'</span><span class="ic">'+ic+'</span><div class="t"><b>'+nm+'</b>'+(tip?'<span>'+tip+'</span>':'')+'</div></div>';
  });
  rl.innerHTML=h;
}
function setDay(n){
  state.day=n;closePopup();
  computeAdj();
  renderTabs();drawMarkers();drawRoute();fitView();showCard();updateSidebar();
}
function setCity(c){
  if(state.city===c)return;
  state.city=c;state.day=(c==='nj'?3:1);closePopup();
  computeAdj();
  document.getElementById('city-nj').classList.toggle('on',c==='nj');
  document.getElementById('city-sz').classList.toggle('on',c==='sz');
  svgEl.setAttribute('viewBox','0 0 '+VB_W+' '+VB_H[c]);
  worldG.innerHTML=buildBase();
  computeAdj();
  renderTabs();drawMarkers();drawRoute();fitView();showCard();updateSidebar();
}

/* ---- 弹窗 ---- */
function openPopup(p){
  var h='<button class="x" onclick="closePopup()">✕</button>';
  h+='<div class="pop-t"><span class="tag" style="background:'+CATS[p.cat].color+'">'+CATICON[p.cat]+' '+CATS[p.cat].label+'</span>'+p.name+'</div>';
  (p.rows||[]).forEach(function(r){h+='<div class="row"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>';});
  if(p.note)h+='<div class="note">💡 '+p.note+'</div>';
  if(p.warn)h+='<div class="warn">⚠️ '+p.warn+'</div>';
  popEl.innerHTML=h;popEl.classList.add('show');
  var old=svgEl.querySelector('.mk.hl');if(old)old.classList.remove('hl');
  var all=svgEl.querySelectorAll('.mk');Array.prototype.forEach.call(all,function(g){if(g.textContent.indexOf(p.name)>=0)g.classList.add('hl');});
}
function closePopup(){popEl.classList.remove('show');popEl.innerHTML='';var old=svgEl.querySelector('.mk.hl');if(old)old.classList.remove('hl');}

/* ---- 交互 ---- */
var dragging=false,q0=null;
mapEl.addEventListener('pointerdown',function(ev){dragging=true;q0=toViewBox(ev);mapEl.classList.add('dragging');mapEl.setPointerCapture(ev.pointerId);});
mapEl.addEventListener('pointermove',function(ev){if(!dragging)return;var q=toViewBox(ev);view.tx+=q.x-q0.x;view.ty+=q.y-q0.y;q0=q;applyView(true);});
window.addEventListener('pointerup',function(){dragging=false;mapEl.classList.remove('dragging');});
mapEl.addEventListener('wheel',function(ev){ev.preventDefault();
  var q=toViewBox(ev),k=ev.deltaY<0?1.14:0.88,s=Math.max(0.6,Math.min(5,view.s*k));
  var px=(q.x-view.tx)/view.s,py=(q.y-view.ty)/view.s;
  view.s=s;view.tx=q.x-s*px;view.ty=q.y-s*py;applyView(true);
},{passive:false});
document.getElementById('zin').onclick=function(){var q={x:VB_W/2,y:VB_H[state.city]/2},s=Math.min(3.2,view.s*1.3);var px=(q.x-view.tx)/view.s,py=(q.y-view.ty)/view.s;view.s=s;view.tx=q.x-s*px;view.ty=q.y-s*py;applyView();};
document.getElementById('zout').onclick=function(){var q={x:VB_W/2,y:VB_H[state.city]/2},s=Math.max(0.5,view.s/1.3);var px=(q.x-view.tx)/view.s,py=(q.y-view.ty)/view.s;view.s=s;view.tx=q.x-s*px;view.ty=q.y-s*py;applyView();};
document.getElementById('fitBtn').onclick=function(){fitView();};
document.getElementById('city-sz').onclick=function(){setCity('sz');};
document.getElementById('city-nj').onclick=function(){setCity('nj');};
window.addEventListener('resize',function(){applyView();});

<style>
:root{

  --line1:#E14B4B; --line2:#5A7FD6; --line3:#3FA55B; --line4:#8E5BA2;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(135deg,#14213d 0%,#1f3a5f 55%,#2b4f7a 100%);color:#fff;padding:10px 16px 0;box-shadow:0 2px 10px rgba(20,30,50,.25);position:relative;z-index:600}
.hd-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
h1 small{font-size:11px;font-weight:400;opacity:.8;margin-left:6px}
.city-switch{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;margin-left:auto}
.city-switch button{border:none;background:transparent;color:#c9d6e8;padding:4px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s}
.city-switch button.on{background:#fff;color:var(--navy);font-weight:700}
.hd-meta{font-size:11.5px;color:#b9c8dd;margin:6px 0 8px;display:flex;gap:12px;flex-wrap:wrap}
.hd-meta span{display:inline-flex;align-items:center;gap:3px}
#dayTabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.day-tab{border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#e6edf7;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.day-tab .dd{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.day-tab:hover{background:rgba(255,255,255,.2)}
.day-tab.on{background:#fff;color:var(--navy);font-weight:700;border-color:#fff}
.day-tab.on .dd{outline:2px solid rgba(30,58,95,.25);outline-offset:1px}
.day-tab.overview{font-weight:600}
#layout{flex:1;display:flex;min-height:0}
#side{width:360px;background:transparent;overflow-y:auto;padding:14px 10px 14px 14px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:0 3px 10px rgba(160,120,70,.12)}
#dayTitle{font-size:16px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
#dayTitle .dd{width:12px;height:12px;border-radius:50%;flex-shrink:0}
#daySub{font-size:11.5px;color:var(--sub);margin-top:2px}
.route-list{margin-top:10px;display:flex;flex-direction:column;gap:0}
.route-item{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12.5px;border-radius:9px;cursor:pointer;transition:.12s}
.route-item:hover{background:#FBF3E0}
.route-item .n{width:21px;height:21px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.route-item .ic{flex-shrink:0;font-size:14px}
.route-item .t{flex:1;min-width:0}
.route-item .t b{font-weight:700;color:var(--ink);display:block}
.route-item .t span{display:block;font-size:11px;color:var(--sub)}
/* 当日时间轴 */
.tl-card{padding:12px 12px 10px}
.tl-title{font-size:13px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tl{position:relative;padding-left:4px}
.tl-item{display:flex;gap:9px;padding:0 0 11px;position:relative}
.tl-item::before{content:"";position:absolute;left:37px;top:20px;bottom:-1px;width:2px;background:#EADFC6}
.tl-item:last-child::before{display:none}
.tl-time{flex-shrink:0;width:66px;font-size:10.5px;font-weight:800;color:#fff;background:var(--navy);border-radius:7px;padding:3px 5px;text-align:center;align-self:flex-start;line-height:1.3}
.tl-body{flex:1;min-width:0}
.tl-act{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.5}
.tl-tags{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
.tl-tag{font-size:10px;font-weight:700;border-radius:5px;padding:1px 6px;color:#fff}
.tl-loc{display:inline-block;margin-top:3px;font-size:11px;color:var(--amber);cursor:pointer;border-bottom:1px dashed #E3B574}
.tl-loc:hover{color:#7A4A0A}
.tl-cost{font-size:10.5px;color:var(--sub);margin-top:2px}
/* 预约清单 */
.book-box{background:#FFF8E7;border:1.5px solid #E3C87A;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.75}
.book-box b{color:#92600A;font-size:12.5px}
.book-box ul{padding-left:16px;color:#7A5B12}
#card{display:none}
#card .cd{font-weight:800;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--navy)}
#card .cd i{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
#card ul{padding-left:18px;color:#4a4f5a;font-size:12.5px;line-height:1.85}
#card li{margin:2px 0}
#card .cost{margin-top:8px;color:var(--amber);font-weight:700;font-size:12.5px;background:#FEF3E2;border-radius:8px;padding:6px 9px}
.legend{font-size:11.5px;color:var(--sub);line-height:1.9;display:flex;flex-wrap:wrap;gap:3px 12px}
.legend .it{display:inline-flex;align-items:center;gap:5px}
.legend .d{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend .ln{width:16px;height:3px;border-radius:2px;display:inline-block}
#map{flex:1;min-width:0;position:relative;margin:12px 14px 14px 0;background:var(--mapbg);border:2px solid var(--border);border-radius:20px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#svgMap{position:absolute;inset:0;width:100%;height:100%}
.world{transition:transform .25s ease}
.world.nosmooth{transition:none}
.water{stroke-linejoin:round}
.geo{font-size:14px;font-weight:800;fill:#7c9fbf;letter-spacing:2px;pointer-events:none;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.geo.water-t{fill:#5c86a8;font-size:15px}
.geo.hill-t{fill:#7a9c66}
.geo.dist-t{fill:#A98A5E;font-size:12.5px;letter-spacing:1px;font-weight:700}
.geo.sub-t{fill:#9B8A6F;font-size:11px;letter-spacing:1px;font-weight:700}
.geo.metro-t{fill:#7A6F9E;font-size:10.5px;letter-spacing:.5px;font-weight:700}
.bound{fill-opacity:.16;stroke-dasharray:5 5;stroke-width:1.6;stroke-linejoin:round}
.bound.dashed2{stroke-dasharray:2 4}
.metro-line{stroke-linecap:round;opacity:.8}
.metro-st{fill:#fff;stroke-width:2}
.metro-st.key{stroke-width:2.5}
.mk{cursor:pointer}
.mk .dot{transition:transform .15s,filter .15s}
.mk:hover .dot{transform:scale(1.18);filter:brightness(1.06)}
.mk.hl .dot{transform:scale(1.3)}
.mk .lbl{font-size:12px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:rgba(255,246,227,.97);stroke-width:6px;stroke-linejoin:round;pointer-events:none;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.mk.stop .lbl{font-size:13px}
.mk.ctx .lbl{opacity:0;transition:opacity .12s}
.mk.ctx.lbl-on .lbl{opacity:.92}
.mk.ctx.lbl-on:hover .lbl{opacity:1}
.mk.ctx:hover .lbl,.mk.overview:hover .lbl{opacity:1}
.mk.overview .dot{opacity:.6}
.mk .ic{font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk .numt{font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--ink);pointer-events:none}
.rt-line{fill:none;stroke-width:4.5;stroke-dasharray:2 11;stroke-linecap:round;opacity:.9}
.rt-start{font-size:11px;font-weight:800;fill:#2E9E5B;paint-order:stroke;stroke:rgba(255,255,255,.95);stroke-width:4px;pointer-events:none}
.rt-arrow{fill:#fff;stroke-width:1.5}
.rt-seg{font-size:10px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rt-seg-c{fill:var(--navy);stroke:#fff;stroke-width:1.5;opacity:.92}
#popup{position:absolute;right:12px;bottom:12px;width:min(350px,calc(100% - 24px));background:#fff;border:1.5px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(60,40,10,.28);padding:12px 14px;font-size:12.5px;line-height:1.7;color:#4a4f5a;display:none;z-index:30;max-height:62%;overflow-y:auto}
#popup.show{display:block;animation:up .18s ease}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#popup .pop-t{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:6px;padding-right:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#popup .tag{color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
#popup .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
#popup .chip2{background:#F5EDDB;border-radius:7px;padding:2px 8px;font-size:11px;color:#6B5B3F;font-weight:700}
#popup .row{display:flex;gap:8px;margin:4px 0;font-size:12.5px}
#popup .row b{color:var(--ink);flex-shrink:0;min-width:54px;font-weight:700}
#popup .sec2{margin-top:9px;font-size:12px;font-weight:800;color:var(--navy);border-left:3px solid var(--border);padding-left:8px}
#popup .plan{list-style:none;margin-top:5px}
#popup .plan li{display:flex;gap:7px;margin:5px 0;font-size:12.5px;line-height:1.65}
#popup .plan li em{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
#popup .note{margin-top:8px;padding:7px 9px;background:#FFF8E7;border:1px solid #F0DCA8;border-radius:9px;color:#8A5A10}
#popup .warn{margin-top:6px;padding:7px 9px;background:#FEF2F2;border:1px solid #F5C2C2;border-radius:9px;color:#9B1C1C}
#popup .x{position:absolute;top:8px;right:10px;border:none;background:#F3E9D8;color:#8a7a5c;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1}
#popup .x:hover{background:#E8D9BD;color:var(--ink)}
#zoomBox{position:absolute;right:12px;top:12px;z-index:20;display:flex;flex-direction:column;gap:6px}
#zoomBox button{width:30px;height:30px;border:1.5px solid var(--border);background:#fff;border-radius:9px;font-size:15px;font-weight:800;color:var(--navy);cursor:pointer;box-shadow:0 2px 6px rgba(160,120,70,.18);line-height:1}
#zoomBox button:hover{background:#FBF1DC}
#fitBtn{position:absolute;left:12px;bottom:12px;z-index:20;border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:11.5px;color:var(--navy);cursor:pointer;box-shadow:0 2px 6px rgba(160,120,70,.18)}
#fitBtn:hover{background:#FBF1DC}
#mapHint{position:absolute;left:12px;top:12px;z-index:20;background:rgba(255,255,255,.93);border:1.5px solid var(--border);border-radius:999px;padding:4px 11px;font-size:11px;color:var(--sub);box-shadow:0 2px 6px rgba(160,120,70,.15);pointer-events:none}
@media (max-width:860px){
  #layout{flex-direction:column}
  #side{width:100%;order:2;padding:12px}
  #map{order:1;height:56vh;margin:12px}
  h1{font-size:15px}
  .hd-meta{gap:6px}
}
</style>
</head>

    for(var i=1;i<pts.length;i++)ds+=' L'+pts[i].x.toFixed(1)+','+pts[i].y.toFixed(1);
    h+='<path class="metro-line" d="'+ds+'" stroke="#fff" stroke-width="8" opacity=".9"/>';
    h+='<path class="metro-line" d="'+ds+'" stroke="'+m.color+'" stroke-width="4"/>';
    m.sts.forEach(function(s,k){
      var q=proj(c,s[1],s[2]),key=!!s[3];
      h+='<circle class="metro-st'+(key?' key':'')+'" cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="'+(key?4.6:3.2)+'" fill="#fff" stroke="'+m.color+'"/>';
      if(key&&!metroSeen[s[0]]){
        metroSeen[s[0]]=1;
        var opts=[{dx:10,dy:16,an:'start'},{dx:10,dy:-12,an:'start'},{dx:-10,dy:16,an:'end'},{dx:-10,dy:-12,an:'end'}];
        var best=opts[0],bestScore=1e9;
        opts.forEach(function(o){
          var score=0;
          METRO[c].forEach(function(m2){m2.sts.forEach(function(s2){
            if(!s2[3]||s2[0]===s[0])return;
            var q2=proj(c,s2[1],s2[2]);
            var dd=Math.hypot(q.x+o.dx-q2.x,q.y+o.dy-q2.y);
            if(dd<52)score+=(52-dd);
          });});
          if(score<bestScore){bestScore=score;best=o;}
        });
        h+='<text class="geo metro-t" x="'+(q.x+best.dx).toFixed(1)+'" y="'+(q.y+best.dy).toFixed(1)+'" text-anchor="'+best.an+'">'+s[0]+'</text>';
      }
    });
  });
  // 城墙
  if(c==='nj'){
    var wall=[[32.034,118.758],[32.052,118.778],[32.058,118.798],[32.048,118.818],[32.028,118.820],[32.012,118.802],[32.014,118.776],[32.024,118.758]];
    h+='<path class="wall" d="'+smoothD(P(c,wall),true)+'" fill="none" stroke="#D9C9A8" stroke-width="2.5" stroke-dasharray="6 6"/>';
  }
  LABELS[c].forEach(function(l){var pt=proj(c,l.at[0],l.at[1]);h+='<text class="geo '+(l.cls||'')+'" x="'+pt.x.toFixed(1)+'" y="'+pt.y.toFixed(1)+'">'+l.t+'</text>';});
  (LANDMARKS[c]||[]).forEach(function(l){var pt=proj(c,l[1],l[2]);h+='<text class="geo sub-t" x="'+pt.x.toFixed(1)+'" y="'+pt.y.toFixed(1)+'">'+l[0]+'</text>';});
  h+=deco(c);
  return h;
}

/* ---- 元素引用 ---- */
var svgEl=document.getElementById('svgMap'), worldG=document.getElementById('world');
var mapEl=document.getElementById('map'), popEl=document.getElementById('popup');
var view={s:1,tx:0,ty:0},ADJ={};

function computeAdj(){
  ADJ={};
  var c=state.city,d=state.day;
  var list=ALLPOIS.filter(function(p){return p.city===c&&d!==null&&p.day&&p.day.indexOf(d)>=0;});
  if(list.length<2){list.forEach(function(p){var q=proj(c,p.lat,p.lng);ADJ[p.id]={x:q.x,y:q.y};});return;}
  var pts=list.map(function(p){var q=proj(c,p.lat,p.lng);return {id:p.id,x:q.x,y:q.y,dx:0,dy:0};});
  var minDist=50;
  for(var it=0;it<5;it++){
    for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){
      var a=pts[i],b=pts[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<minDist&&dist>0.5){
        var push=(minDist-dist)*0.35,ux=dx/dist,uy=dy/dist;
        a.dx-=ux*push;a.dy-=uy*push;b.dx+=ux*push;b.dy+=uy*push;
      }
    }
  }
  pts.forEach(function(q){
    var m=Math.hypot(q.dx,q.dy);
    if(m>30){q.dx*=30/m;q.dy*=30/m;}
    ADJ[q.id]={x:q.x+q.dx,y:q.y+q.dy};
  });
  var route=d!==null?ROUTES[c+'-'+d]:null;
  if(route){
    var ids=[];
    route.forEach(function(nm){var p=findPOI(c,nm);if(p&&ADJ[p.id])ids.push(p.id);});
    for(var pass=0;pass<5;pass++){
      var moved=false;
      for(var k=0;k<ids.length-1;k++){
        var a=ADJ[ids[k]],b=ADJ[ids[k+1]];
        if(!a||!b)continue;
        var dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy);
        if(dd<62&&dd>0.5){
          var ux=dx/dd,uy=dy/dd,push=62-dd;
          b.x+=ux*push;b.y+=uy*push;moved=true;
        }
      }
      if(!moved)break;
    }
  }
  var keys=Object.keys(ADJ);
  for(var it=0;it<3;it++){
    for(var i2=0;i2<keys.length;i2++)for(var j2=i2+1;j2<keys.length;j2++){
      var a2=ADJ[keys[i2]],b2=ADJ[keys[j2]];
      var dx2=b2.x-a2.x,dy2=b2.y-a2.y,d2=Math.hypot(dx2,dy2);
      if(d2<56&&d2>0.5){
        var push2=(56-d2)*0.4,ux2=dx2/d2,uy2=dy2/d2;
        a2.x-=ux2*push2;a2.y-=uy2*push2;b2.x+=ux2*push2;b2.y+=uy2*push2;
      }
    }
  }
  list.forEach(function(p){
    var q=proj(c,p.lat,p.lng),A=ADJ[p.id];
    var dx3=A.x-q.x,dy3=A.y-q.y,m3=Math.hypot(dx3,dy3);
    if(m3>58){A.x=q.x+dx3*58/m3;A.y=q.y+dy3*58/m3;}
  });
}

function drawMarkers(){
  var old=svgEl.querySelector('.layer-mk'); if(old)old.remove();
  var c=state.city,d=state.day,layer=document.createElementNS(NS,'g');
  layer.setAttribute('class','layer-mk');
  var route=(d!==null)?ROUTES[c+'-'+d]:null, idx={};
  if(route)route.forEach(function(nm,i){var p=findPOI(c,nm);if(p)idx[p.id]=i+1;});
  var list=ALLPOIS.filter(function(p){
    if(p.city!==c)return false;
    if(d===null)return p.cat==='spot'||p.cat==='photo'||p.cat==='food';
    return p.day&&p.day.indexOf(d)>=0;
  });
  list.sort(function(a,b){
    var na=idx[a.id]||999,nb=idx[b.id]||999;
    if(na!==nb)return na-nb;
    return PRIO[a.cat]-PRIO[b.cat];
  });
  var centers=[];
  list.forEach(function(p){
    if(d!==null&&idx[p.id]===undefined&&(p.cat==='hotel'||p.cat==='transit')&&!(p.day&&p.day.indexOf(d)>=0))return;
    var pt=ADJ[p.id]||proj(c,p.lat,p.lng);
    centers.push({p:p,x:pt.x,y:pt.y});
  });
  var placed=[];
  centers.forEach(function(it){
    var p=it.p,pt={x:it.x,y:it.y},g=document.createElementNS(NS,'g');
    var num=idx[p.id],isStop=d!==null&&num!==undefined;
    g.setAttribute('class','mk cat-'+p.cat+(d===null?' overview':(isStop?' day stop':' day ctx')));
    g.setAttribute('transform','translate('+pt.x.toFixed(1)+','+pt.y.toFixed(1)+')');
    var inner;
    if(d===null){
      inner='<circle class="dot" r="6.5" fill="'+CATS[p.cat].color+'" stroke="#fff" stroke-width="1.5"/>';
    }else if(isStop){
      inner='<circle class="dot" r="13" fill="'+DAYMETA[c][d].color+'" stroke="#fff" stroke-width="3.5"/>';
      inner+='<circle class="num" r="8.5" fill="#fff" opacity="0.97"/><text class="numt" y="1">'+num+'</text>';
    }else{
      inner='<circle class="dot" r="10.5" fill="'+CATS[p.cat].color+'" stroke="#fff" stroke-width="2.5"/>';
      inner+='<text class="ic" y="1">'+CATICON[p.cat]+'</text>';
    }
    // 标签（8 向避让 + 最差兜底）
    var hoverOnly=(d!==null)&&!isStop&&(p.cat==='hotel'||p.cat==='transit');
    if(d===null){
      inner+='<title>'+p.name+'</title>';
    }else{
      var fs=isStop?13.5:10.5;
      var nw=p.name.length*(fs+1)+10,nh=fs+9;
      var anchors=[{dx:28,dy:2,an:'start'},{dx:-28,dy:2,an:'end'},{dx:0,dy:-28,an:'middle'},{dx:0,dy:34,an:'middle'},
                   {dx:34,dy:-18,an:'start'},{dx:-34,dy:-18,an:'end'},{dx:34,dy:22,an:'start'},{dx:-34,dy:22,an:'end'}];
      if(num===1)anchors=[{dx:0,dy:-28,an:'middle'},{dx:0,dy:34,an:'middle'},{dx:-28,dy:2,an:'end'},{dx:28,dy:2,an:'start'},{dx:-34,dy:22,an:'end'},{dx:34,dy:22,an:'start'}];
      if(num===centers.length)anchors=[{dx:0,dy:34,an:'middle'},{dx:0,dy:-28,an:'middle'},{dx:28,dy:2,an:'start'},{dx:-28,dy:2,an:'end'}];
      var best=null,bestScore=1e9,bestLbl=1e9;
      for(var ai=0;ai<anchors.length;ai++){
        var a=anchors[ai],lx=pt.x+a.dx,ly=pt.y+a.dy;
        var box={x:(a.an==='end'?lx-nw:a.an==='middle'?lx-nw/2:lx),y:ly-nh/2,w:nw,h:nh};
        var score=0;
        var lblScore=0;for(var bi=0;bi<placed.length;bi++){var q=placed[bi];if(box.x<q.x+q.w&&box.x+box.w>q.x&&box.y<q.y+q.h&&box.y+box.h>q.y){score+=3;lblScore++;}}
        for(var ci=0;ci<centers.length;ci++){
          var o=centers[ci];
          if(o.p.id===p.id)continue;
          if(o.x>box.x-13&&o.x<box.x+box.w+13&&o.y>box.y-13&&o.y<box.y+box.h+13)score+=8;
        }
        if(score<bestScore||(score===bestScore&&lblScore<bestLbl)){bestScore=score;bestLbl=lblScore;best={a:a,box:box};}
        if(score===0)break;
      }
      // 钳制在画布内
      var bx=best.box,shiftX=0,shiftY=0;
      if(bx.x<12)shiftX=12-bx.x;
      if(bx.x+bx.w>VB_W-12)shiftX=(VB_W-12)-(bx.x+bx.w);
      if(bx.y<12)shiftY=12-bx.y;
      if(bx.y+bx.h>VB_H[c]-12)shiftY=(VB_H[c]-12)-(bx.y+bx.h);
      if(shiftX){best.a.dx+=shiftX;bx.x+=shiftX;}
      if(shiftY){best.a.dy+=shiftY;bx.y+=shiftY;}
      placed.push(bx);
      var lblCls='lbl'+(isStop?' stop-lbl':'')+(hoverOnly?'':' lbl-on');
      inner+='<text class="'+lblCls+'" x="'+best.a.dx+'" y="'+best.a.dy+'" text-anchor="'+best.a.an+'" style="font-size:'+fs+'px">'+p.name+'</text>';
    }
    g.innerHTML=inner;
    g.addEventListener('click',function(ev){ev.stopPropagation();openPopup(p);});
    layer.appendChild(g);
  });
  worldG.appendChild(layer);
}

function applyView(noSmooth){worldG.classList.toggle('nosmooth',!!noSmooth);worldG.setAttribute('transform','translate('+view.tx.toFixed(1)+','+view.ty.toFixed(1)+') scale('+view.s+')');}
function fitView(){
  var c=state.city,d=state.day,pts=[];
  if(d!==null){
    var seen={};
    (ROUTES[c+'-'+d]||[]).forEach(function(nm){var p=findPOI(c,nm);if(p&&!seen[p.id]){seen[p.id]=1;pts.push(ADJ[p.id]||proj(c,p.lat,p.lng));}});
    ALLPOIS.forEach(function(p){if(p.city===c&&p.day&&p.day.indexOf(d)>=0&&!seen[p.id]){seen[p.id]=1;pts.push(ADJ[p.id]||proj(c,p.lat,p.lng));}});
  }
  if(pts.length<2){view={s:1,tx:0,ty:0};applyView();return;}
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pts.forEach(function(p){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
  var cw=Math.max(260,mapEl.clientWidth),ch=Math.max(260,mapEl.clientHeight);
  var kx=cw/VB_W,ky=ch/VB_H[c];
  var s=Math.min(cw*0.9/Math.max((x1-x0)*kx,1),ch*0.9/Math.max((y1-y0)*ky,1));
  s=Math.max(0.6,Math.min(4.5,s));
  view={s:s,tx:VB_W/2-s*(x0+x1)/2,ty:VB_H[c]/2-s*(y0+y1)/2};
  applyView();
}
function toViewBox(ev){
  var ctm=svgEl.getScreenCTM(),pt=svgEl.createSVGPoint();
  pt.x=ev.clientX;pt.y=ev.clientY;
  var q=pt.matrixTransform(ctm.inverse());
  return {x:q.x,y:q.y};
}

var dragging=false,q0=null;
mapEl.addEventListener('pointerdown',function(ev){dragging=true;q0=toViewBox(ev);mapEl.classList.add('dragging');mapEl.setPointerCapture(ev.pointerId);});
mapEl.addEventListener('pointermove',function(ev){if(!dragging)return;var q=toViewBox(ev);view.tx+=q.x-q0.x;view.ty+=q.y-q0.y;q0=q;applyView(true);});

mapEl.addEventListener('wheel',function(ev){ev.preventDefault();
  var q=toViewBox(ev),k=ev.deltaY<0?1.14:0.88,s=Math.max(0.6,Math.min(5,view.s*k));
  var px=(q.x-view.tx)/view.s,py=(q.y-view.ty)/view.s;
  view.s=s;view.tx=q.x-s*px;view.ty=q.y-s*py;applyView(true);
},{passive:false});
document.getElementById('zin').onclick=function(){var q={x:VB_W/2,y:VB_H[state.city]/2},s=Math.min(3.2,view.s*1.3);var px=(q.x-view.tx)/view.s,py=(q.y-view.ty)/view.s;view.s=s;view.tx=q.x-s*px;view.ty=q.y-s*py;applyView();};
document.getElementById('zout').onclick=function(){var q={x:VB_W/2,y:VB_H[state.city]/2},s=Math.max(0.5,view.s/1.3);var px=(q.x-view.tx)/view.s,py=(q.y-view.ty)/view.s;view.s=s;view.tx=q.x-s*px;view.ty=q.y-s*py;applyView();};
document.getElementById('fitBtn').onclick=function(){fitView();};
document.getElementById('city-sz').onclick=function(){setCity('sz');};
document.getElementById('city-nj').onclick=function(){setCity('nj');};
window.addEventListener('resize',function(){applyView();});

/* ---- 图例 ---- */
function renderLegend(){
  var box=document.getElementById('legendBox');
  var names={spot:'景点',food:'美食',photo:'拍照机位',hotel:'住宿',transit:'交通',avoid:'避雷'},keys=['spot','food','photo','hotel','transit','avoid'],h='';
  h+='<span style="font-weight:800;color:var(--navy);width:100%">🗺️ 图例</span>';
  keys.forEach(function(k){h+='<span class="it"><span class="d" style="background:'+CATS[k].color+'"></span>'+names[k]+'</span>';});
  h+='<span class="it"><span class="d" style="background:#2E9E5B"></span>起点</span><span class="it">🚩终点</span>';
  h+='<span class="it"><span class="d" style="background:#ef4444"></span>当日主站(编号)</span><span class="it"><span class="d" style="background:#f59e0b;width:16px;height:4px;border-radius:2px"></span>当日动线</span>';
  if(state.city==='nj'){
    h+='<span class="it"><span class="ln" style="background:#E14B4B"></span>1号线</span><span class="it"><span class="ln" style="background:#4A7FBE"></span>2号线</span><span class="it"><span class="ln" style="background:#3FA55B"></span>3号线</span><span class="it"><span class="ln" style="background:#8E5BA2"></span>4号线</span>';
  }else{
    h+='<span class="it"><span class="ln" style="background:#3FA55B"></span>1号线</span><span class="it"><span class="ln" style="background:#4A7FBE"></span>4号线</span>';
  }
  box.innerHTML=h;
}


/* ---- 启动 ---- */
function setDay(n){
  state.day=n;closePopup();
  computeAdj();
  renderTabs();drawRoute();drawMarkers();fitView();showCard();updateSidebar();updateTimeline();renderLegend();
}
function setCity(c){
  if(state.city===c)return;
  state.city=c;state.day=(c==='nj'?3:1);closePopup();
  computeAdj();
  document.getElementById('city-nj').classList.toggle('on',c==='nj');
  document.getElementById('city-sz').classList.toggle('on',c==='sz');
  svgEl.setAttribute('viewBox','0 0 '+VB_W+' '+VB_H[c]);
  worldG.innerHTML=buildBase();
  computeAdj();
  renderTabs();drawRoute();drawMarkers();fitView();showCard();updateSidebar();updateTimeline();renderLegend();
}
svgEl.setAttribute('viewBox','0 0 '+VB_W+' '+VB_H.sz);
worldG.innerHTML=buildBase();
computeAdj();
renderTabs();drawRoute();drawMarkers();fitView();showCard();updateSidebar();updateTimeline();
renderLegend();
</script>
</body>
